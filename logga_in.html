<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
     
    <header>
        <a class="brand" href="index.html">
            <img src="img\svamplogo-kantarell.png" alt="Logotyp">
            <span> Svampar</span>

      <nav class="navbar">
        <button class="menu" id="menu-btn">=</button>
        <ul class="nav-links" id="nav-links">

    <main class="loggin"> 
        
        <section>
            <h1>Logga in</h1>
            <p>Fyll i dina uppgifter för att logga in på ditt konto</p>
        </section>

        <form>
            <label for="namn">Namn</label>
            <input type="text" id="namn" placeholder="Ange ditt namn" name="namn" required>

            <label for="lösenord">Lösenord</label>
            <input type="password" id="lösenord" placeholder="Ange ditt lösenord" name="lösenord" ><br>

            <input type="submit" value="Logga in">
        </form>

        <img src="img\Loggo.png" alt="Svampletarna"> 

    </main>
